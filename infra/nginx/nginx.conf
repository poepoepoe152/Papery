events {}

http {
    client_max_body_size 30m;

    upstream papery_frontend { server frontend:3000; }
    upstream papery_backend  { server backend:8000; }

    server {
        listen 80;
        server_name _;

        # API + health -> FastAPI backend
        location /api/ {
            proxy_pass http://papery_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /health {
            proxy_pass http://papery_backend;
        }

        # Everything else -> Next.js frontend
        location / {
            proxy_pass http://papery_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # For production TLS, terminate HTTPS here (listen 443 ssl) with your
    # certificates, or run behind a managed load balancer / CDN.
}
