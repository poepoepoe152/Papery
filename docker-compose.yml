services:
  db:
    image: postgres:16-alpine
    container_name: papery-db
    environment:
      POSTGRES_USER: papery
      POSTGRES_PASSWORD: papery
      POSTGRES_DB: papery
    ports:
      - "5432:5432"
    volumes:
      - papery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papery"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: papery-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://papery:papery@db:5432/papery
      JWT_SECRET: dev-secret-change-me
      # Allow both localhost (same machine) and your LAN IP (phone/other devices).
      CORS_ORIGINS: "http://localhost:3000,http://${HOST_IP:-localhost}:3000"
      SUPER_ADMIN_EMAIL: admin@papery.app
      SUPER_ADMIN_PASSWORD: Admin123!
      STORAGE_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - papery_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: papery-frontend
    environment:
      # Defaults to localhost; set HOST_IP to your computer's LAN IP to access
      # the app from a phone on the same Wi-Fi (see .env.example).
      NEXT_PUBLIC_API_URL: "http://${HOST_IP:-localhost}:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  papery_pgdata:
  papery_uploads:
